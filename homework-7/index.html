<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Стилизация формы и checkbox</title>
		<link rel="stylesheet" href="./css/normalize.css" />
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<legend class="form-group-title">Ваши данные</legend>
				<label for="name" class="label">Ваше ФИО:</label>
				<input
					id="name"
					class="input"
					type="text"
					placeholder="ФИО"
					name="name"
					required
				/>
				<label for="age" class="label">Ваш возраст:</label>
				<input
					id="age"
					class="input"
					type="number"
					placeholder="Возраст"
					name="age"
					required
				/>
				<label for="phone" class="label">Ваш контактный номер:</label>
				<input
					id="phone"
					class="input"
					type="tel"
					placeholder="Номер телефона"
					name="phone"
					required
				/>
				<label for="email" class="label">Ваш email:</label>
				<input
					id="email"
					class="input"
					type="email"
					placeholder="Почта"
					name="email"
					required
				/>
			</fieldset>
			<fieldset class="form-group">
				<label for="message" class="label">Причина обращения:</label>
				<textarea
					id="message"
					class="textarea"
					placeholder="Ваше обращение"
					name="message"
					required
				></textarea>
				<label class="label checkbox-lable">
					<input class="checkbox" type="checkbox" name="checkbox" required />
					<span class="checkbox-text">Я принимаю правила</span>
				</label>
			</fieldset>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
